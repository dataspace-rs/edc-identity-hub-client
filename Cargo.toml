[package]
name = "edc-identity-hub-client"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description= "A Rust client for EDC Identity Hub"
repository = "https://github.com/dataspace-rs/edc-identity-hub-client"
keywords = ["dataspace", "http"]
categories = []
readme = "README.md"

[features]
management = []

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13", features = ["json"]}
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
clap = { version = "4.6.3", features = ["derive", "env"] }
tokio = { version = "1.53.1", features = ["full"] }
